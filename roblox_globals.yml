# Minimal Roblox globals for Selene. Full Roblox API checking is done by
# luau-lsp against the official type definitions (see scripts/check.sh);
# this std only lets Selene's style/correctness lints run offline.
---
base: luau
name: roblox_globals
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  task: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector3: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  Region3: { any: true }
  BrickColor: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  TweenInfo: { any: true }
  Random: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  PhysicalProperties: { any: true }
  Font: { any: true }
  DateTime: { any: true }
  Faces: { any: true }
